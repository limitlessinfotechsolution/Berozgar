name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # NEXT_PUBLIC_SITE_URL is required — a production build fails without it.
      # Only affects sitemap/robots/OG URLs, so a placeholder is fine in CI.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://berozgar.example.com
