# Netlify build configuration for the Berozgar storefront.
#
# Environment variables set in this file take precedence over ones set in the
# Netlify UI, so keep NEXT_PUBLIC_SITE_URL here and nowhere else — defining it
# in both places means the UI value is silently ignored.
#
# Secrets never go in this file: it is public to anyone with repo access.
# REVALIDATE_SECRET and ERP_API_URL belong in the Netlify UI under
# Site configuration -> Environment variables.
#
# Node version comes from .nvmrc (24); Netlify reads it automatically.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # NEXT_PUBLIC_* values are inlined into the bundle at build time, so changing
  # this needs a fresh deploy — a cached rebuild will keep the old origin.
  # It feeds canonical URLs, the sitemap, robots.txt and OG image URLs, so it
  # must be the real origin before the site is indexed.
  NEXT_PUBLIC_SITE_URL = "https://berozgari.netlify.app"

  # The ERP origin, as NEXT_PUBLIC_ on purpose.
  #
  # [build.environment] reaches the build only, and the storefront also needs the
  # ERP at request time — ISR regeneration and the /api/checkout, /api/checkout/
  # quote and /api/track handlers all run in Netlify functions. A plain
  # ERP_API_URL here would not reach them, and the Netlify UI variable never
  # arrived either: two builds fell through to the localhost default.
  #
  # NEXT_PUBLIC_* is inlined into the bundle at build time, server code included,
  # so the function holds this as a literal and needs no runtime environment.
  # src/lib/catalogue.ts still prefers a private ERP_API_URL when one exists.
  #
  # TEMPORARY: a cloudflared quick tunnel to the ERP on a laptop.
  #
  # Quick tunnels are disposable. Cloudflare revoked the previous one outright —
  # cloudflared stayed running but logged "Unauthorized: Tunnel not found" and
  # retried forever, so the site showed CATALOGUE UNAVAILABLE until it was
  # restarted with a new hostname. Expect to repeat that: restart cloudflared,
  # put the new URL here, push. A named tunnel or a hosted ERP removes this.
  #
  # REVALIDATE_SECRET must NEVER move here — NEXT_PUBLIC_ or not, this file is
  # committed, and a NEXT_PUBLIC_ secret would also ship in client JS. It stays a
  # Netlify UI variable.
  NEXT_PUBLIC_ERP_API_URL = "https://resolution-reaches-aims-save.trycloudflare.com"
